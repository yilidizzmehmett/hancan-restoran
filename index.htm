
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151515">
<title>Hancan Kebap Döner | Menü ve Sipariş</title>
<style>
:root{--gold:#d5a642;--dark:#151515;--panel:#222;--text:#f7f7f7;--muted:#bcbcbc;--green:#20b65a}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#111;color:var(--text)}
header{text-align:center;padding:28px 15px 22px;background:linear-gradient(135deg,#252525,#101010);border-bottom:2px solid var(--gold)}
.logo{width:76px;height:76px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);border-radius:50%;color:var(--gold);font-size:28px;font-weight:900}
header h1{margin:0;color:var(--gold);font-size:clamp(25px,5vw,36px)}
header p{color:#ddd;margin:8px 0 0}
.container{width:min(1100px,100%);margin:auto;padding:18px 14px 40px}
h2{color:var(--gold);margin:10px 0 16px}
.category-bar{display:flex;gap:9px;overflow-x:auto;padding:5px 2px 14px;margin-bottom:12px;scrollbar-width:thin;scrollbar-color:var(--gold) #292929;position:sticky;top:0;z-index:10;background:#111}
.category-btn{flex:0 0 auto;border:1px solid #555;border-radius:22px;background:#252525;color:white;padding:12px 16px;font-size:14px;font-weight:bold;cursor:pointer;white-space:nowrap}
.category-btn.active{background:var(--gold);border-color:var(--gold);color:#171717}
.category-btn:focus-visible,.add-btn:focus-visible,.qty-btn:focus-visible{outline:2px solid white;outline-offset:3px}
.menu-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 16px}
.menu-heading h2{margin:0}.product-count{color:var(--muted);font-size:13px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;background:var(--panel);border:1px solid #353535;border-radius:12px;padding:14px 12px}
.product-name{font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.price{display:block;color:var(--gold);font-weight:bold;margin-top:7px;white-space:nowrap}
.add-btn{flex:0 0 auto;background:var(--gold);color:#161616;border:0;border-radius:8px;padding:10px 12px;font-weight:bold;cursor:pointer}
.cart{margin-top:30px;padding:18px;background:#202020;border:1px solid #414141;border-radius:14px}
.cart h2{margin-top:0}.empty-cart{color:var(--muted);font-size:14px}
.cart-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #3c3c3c}
.cart-item-name{font-size:14px;line-height:1.5}.cart-item-price{color:var(--gold);font-weight:bold;white-space:nowrap}
.qty-controls{display:flex;align-items:center;gap:9px;margin-top:7px}
.qty-btn{width:30px;height:30px;border:0;border-radius:7px;font-size:18px;font-weight:bold;background:#444;color:white;cursor:pointer}
.qty-number{min-width:15px;text-align:center}
.remove-btn{background:transparent;border:0;color:#ff8585;cursor:pointer;font-size:12px;padding:5px 0}
.cart-total{display:flex;justify-content:space-between;gap:10px;font-size:20px;font-weight:bold;padding:18px 0}
.cart-total span:last-child{color:var(--gold)}
.order-fields{display:grid;gap:10px;margin-top:8px}
.order-fields input,.order-fields textarea{width:100%;border:1px solid #4b4b4b;background:#151515;color:white;border-radius:8px;padding:12px;font:inherit}
.order-fields textarea{min-height:75px;resize:vertical}
.payment-section{margin-top:20px}
.payment-section h3{color:var(--gold);margin:0 0 8px}
.payment-hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.payment-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.payment-option{display:flex;align-items:center;gap:10px;min-height:76px;padding:12px;background:#171717;border:1px solid #454545;border-radius:10px;cursor:pointer;text-align:left;color:white;font:inherit}
.payment-option.selected{border:2px solid var(--gold);background:#292317}
.payment-option input{accent-color:var(--gold);width:18px;height:18px;flex:0 0 auto}
.payment-logo{min-width:72px;max-width:110px;text-align:center;font-weight:900;font-size:15px;line-height:1.1;padding:8px 5px;border-radius:7px;background:#292929;overflow-wrap:anywhere}
.logo-cash{color:#42d392}.logo-card{color:#5db8ff}.logo-multinet{color:#42d9c0}.logo-edenred{color:#ff4545}.logo-metropol{color:#38a9ff}.logo-pluxee{color:#54e879}.logo-setcard{color:#267bff}.logo-token{color:#ffad43}.logo-money{color:#ff742d}
.payment-name{font-size:13px;font-weight:bold}
.table-banner{display:none;margin:0 0 18px;padding:14px;border:1px solid var(--gold);border-radius:10px;background:#292317;color:var(--gold);font-weight:bold}
.mode-panel{margin:0 0 18px;padding:16px;background:#202020;border:1px solid #414141;border-radius:12px}
.mode-panel label{display:block;color:var(--gold);font-weight:bold;margin-bottom:8px}
.mode-panel select{width:100%;padding:12px;border:1px solid #555;border-radius:8px;background:#151515;color:white;font:inherit}
#tableSelectWrap{margin-top:12px;display:none}
@media(max-width:420px){.payment-options{grid-template-columns:1fr}.payment-option{min-height:64px}}
.whatsapp-btn{display:block;width:100%;margin-top:14px;padding:15px;border:0;border-radius:9px;background:var(--green);color:white;font-size:16px;font-weight:bold;text-align:center;cursor:pointer}
.clear-btn{width:100%;margin-top:10px;padding:11px;background:transparent;border:1px solid #666;border-radius:8px;color:#ddd;cursor:pointer}
footer{padding:24px 12px;text-align:center;color:#999;border-top:1px solid #333;font-size:13px}
@media(max-width:520px){.products{grid-template-columns:1fr}.product{padding:14px}.container{padding-left:12px;padding-right:12px}}
@media(min-width:800px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="logo">HC</div>
  <h1>HANCAN KEBAP DÖNER</h1>
  <p>Lezzetin doğru adresi</p>
</header>
<main class="container">
  <div id="tableBanner" class="table-banner" role="status"></div>
  <section class="mode-panel" id="orderModePanel">
    <label for="orderMode">Sipariş türü</label>
    <select id="orderMode" onchange="updateOrderMode()">
      <option value="">Sipariş türünü seçin</option>
      <option value="table">Masada sipariş</option>
      <option value="takeaway">Paket sipariş</option>
    </select>
    <div id="tableSelectWrap">
      <label for="tableSelect" style="margin-top:12px">Masa numaranız</label>
      <select id="tableSelect" onchange="updateTableSelection()">
        <option value="">Masanızı seçin (1–25)</option>
      </select>
    </div>
  </section>
  <h2>Menümüz</h2>
  <nav id="categoryBar" class="category-bar" aria-label="Menü kategorileri"></nav>
  <section aria-live="polite">
    <div class="menu-heading"><h2 id="categoryTitle">Pide Çeşitleri</h2><span id="productCount" class="product-count"></span></div>
    <div id="products" class="products"></div>
  </section>
  <section class="cart" id="cart">
    <h2>🛒 Sipariş Sepetim</h2>
    <div id="cartItems"><p class="empty-cart">Henüz sepete ürün eklemedin.</p></div>
    <div class="cart-total"><span>Toplam</span><span id="total">0 TL</span></div>
    <div class="order-fields">
      <input id="customerName" type="text" placeholder="Adınız soyadınız" autocomplete="name">
      <input id="customerPhone" type="tel" placeholder="Telefon numaranız" autocomplete="tel">
      <input id="customerAddress" type="text" placeholder="Teslimat adresiniz" autocomplete="street-address">
      <textarea id="orderNote" placeholder="Sipariş notunuz (isteğe bağlı)"></textarea>
    </div>
    <section class="payment-section" aria-labelledby="paymentTitle">
      <h3 id="paymentTitle">Ödeme yöntemi</h3>
      <p class="payment-hint">Ödeme yapacağınız yöntemi seçin.</p>
      <div id="paymentOptions" class="payment-options"></div>
    </section>
    <button class="whatsapp-btn" onclick="sendOrder()">WhatsApp ile Sipariş Ver</button>
    <button class="clear-btn" onclick="clearCart()">Sepeti Temizle</button>
  </section>
</main>
<footer>Hancan Kebap Döner · Afiyet olsun!</footer>
<script>
const categories = [
 {name:"Pide Çeşitleri",items:[["Lahmacun",120],["Kıymalı Pide",200],["Kıymalı Kaşarlı",230],["Kuşbaşılı",250],["Kuşbaşılı Kaşarlı",280],["Mevlana Pide",270],["Bıçak Arası Kıyma",280],["Kaşarlı Pide",230],["Kaşarlı Yumurtalı",260],["Kavurmalı Kaşarlı",270]]},
 {name:"Döner Çeşitleri",items:[["Ekmek Arası (100 GR)",150],["Klasik (100 GR)",150],["Hatay Soslu (100 GR)",150],["Zurna Döner (130 GR)",200],["Pilav Üstü (100 GR)",200],["Pilav Üstü (150 GR)",240],["Porsiyon Döner (150 GR)",250],["Porsiyon Döner (200 GR)",290]]},
 {name:"Kebap ve Izgara",items:[["Burdur Şiş",450],["Adana Kebap",450],["Kuzu Şiş",500],["Ciğer Şiş",500],["Tavuk Şiş",350],["Tavuk Kanat",360],["Patlıcanlı Kebap",450],["Domatesli Kebap",450],["Sarma Beyti",500],["Altı Ezmeli",450],["Yoğurtlu Kebap",500],["Tavuk Kelebek",340],["Tavuk Pirzola",340],["4 Kişilik Hancan Karışık Kebap",2200],["Tek Kişilik Karışık Specİal",900],["Izgara Köfte",450]]},
 {name:"Dürüm Çeşitleri",items:[["Adana Dürüm",220],["Urfa Dürüm",220],["Lahmacun Arası Adana",350],["Tavuk Şiş",200],["Kuzu Şiş",290],["Ciğer Şiş",290],["Köfte Dürüm",220],["Yarım Ekmek Köfte",220],["Specİal Karışık Dürüm (Adana-Kuzu)",450]]},
 {name:"Kiloluk Tavuk ve Izgara",items:[["Kanat 1 KG",699],["Kelebek 1 KG",499],["Pirzola 1 KG",499],["Tavuk Şiş 1 KG",649],["5 Şiş Adana + 5 Şiş Tavuk",1700],["Izgara Köfte 1 KG",1400]]},
 {name:"Çorba Çeşitleri",items:[["Mercimek Çorbası",200],["Tavuk Çorbası",200],["Kelle Paça Çorbası",250],["İşkembe Çorbası",250]]},
 {name:"Burgerler",items:[["Et Hamburger",350],["Tavuk Hamburger",250]]},
 {name:"Saç Kavurmalar",items:[["Et Saç Kavurma",560],["Tavuk Saç Kavurma",360]]},
 {name:"Güveç Çeşitleri",items:[["Güveçte Köfte",450],["Güveçte Kuzu",560],["Güveçte Tavuk",360]]},
 {name:"Tatlılar",items:[["Fırın Sütlaç",80],["Supangle",80],["Sade Künefe",200],["Fıstıklı Künefe",250],["Kare Katmer",250],["Gül Katmer",250],["Fıstıklı Burma",250]]},
 {name:"İçecek Çeşitleri",items:[["Coca cola 33cl.",80],["Coca cola Zero 33cl.",80],["Fanta 33cl.",80],["Sprite 33 cl.",80],["Fuse tea Karpuz 33cl.",80],["Fuse tea Şeftali 33cl.",80],["Fuse tea Mango 33cl.",80],["Fuse tea Limon 33cl.",80],["Fuse tea Çilek 33cl.",80],["Cappy şeftali 33cl.",80],["Cappy karışık 33cl.",80],["Cappy vişne 33cl.",80],["Sütaş ayran 27cl.",50],["Acılı şalgam 33cl.",50],["Acısız şalgam 33cl.",50],["Su 0.5",20],["1 litre kola",100],["1 litre fanta",100],["1 litre sprite",100],["1 litre ayran",80],["1 litre acılı şalgam",80],["1 litre acısız şalgam",80],["2.5 litre kola",130],["2.5 litre fanta",130]]},
 {name:"Mezeler",items:[["Humus",200],["Mutebbel",200],["Babağannuş",200],["Acı Ezme",150],["Haydari",150],["Köpoğlu",200]]}
];

const WHATSAPP_NUMBER = "905451546507";

const paymentMethods = [
 {name:"Nakit",logo:"₺ NAKİT",cls:"logo-cash"},
 {name:"Kart",logo:"BANKA / KREDİ KARTI",cls:"logo-card"},
 {name:"Multinet",logo:"Multinet",cls:"logo-multinet"},
 {name:"Edenred Ticket",logo:"Edenred Ticket",cls:"logo-edenred"},
 {name:"Metropol",logo:"MetropolCard",cls:"logo-metropol"},
 {name:"Pluxee (Sodexo)",logo:"pluxee",cls:"logo-pluxee"},
 {name:"Setcard",logo:"SETCARD",cls:"logo-setcard"},
 {name:"Token flex",logo:"TOKEN FLEX",cls:"logo-token"},
 {name:"MoneyYemek",logo:"MONEY Yemek",cls:"logo-money"},
 {name:"IBAN ile Havale/EFT",logo:"IBAN",cls:"logo-card"}
];

const params = new URLSearchParams(window.location.search);
const tableParam = params.get("masa");
let tableNumber = tableParam && /^[1-9]$|^1[0-9]$|^2[0-5]$/.test(tableParam) ? tableParam : null;
let selectedPayment = "";
let orderMode = tableNumber ? "table" : "";
const portionCategories = ["Pide Çeşitleri","Kebap ve Izgara","Dürüm Çeşitleri","Saç Kavurmalar","Güveç Çeşitleri"];
let selectedCategory = 0;
const cart = new Map();

function formatPrice(amount){
 return amount.toLocaleString("tr-TR")+" TL";
}

function renderPaymentOptions(){
 const container=document.getElementById("paymentOptions");
 paymentMethods.forEach(method=>{
  const label=document.createElement("label");
  label.className="payment-option";

  const radio=document.createElement("input");
  radio.type="radio";
  radio.name="paymentMethod";
  radio.value=method.name;

  radio.addEventListener("change",()=>{
   selectedPayment=method.name;
   document.querySelectorAll(".payment-option").forEach(el=>el.classList.remove("selected"));
   label.classList.add("selected");
   const iban=document.getElementById("ibanDetails");
   if(iban) iban.style.display=selectedPayment==="IBAN ile Havale/EFT"?"block":"none";
  });

  const logo=document.createElement("span");
  logo.className="payment-logo "+method.cls;
  logo.textContent=method.logo;

  const name=document.createElement("span");
  name.className="payment-name";
  name.textContent=method.name;

  label.append(radio,logo,name);
  container.appendChild(label);

  if(method.name==="IBAN ile Havale/EFT"){
   const details=document.createElement("div");
   details.id="ibanDetails";
   details.className="payment-hint";
   details.style.display="none";
   details.style.gridColumn="1 / -1";
   details.innerHTML="<strong>Hesap sahibi:</strong> Mehmet Yıldız<br><strong>IBAN:</strong> TR63 0015 7000 0000 0158 1639 83<br><small>Havale/EFT sonrası siparişiniz ödeme kontrolünden sonra onaylanır.</small>";
   container.appendChild(details);
  }
 });
}

function setupTableOptions(){
 const select=document.getElementById("tableSelect");
 for(let i=1;i<=25;i++){
  const option=document.createElement("option");
  option.value=String(i);
  option.textContent="Masa "+i;
  select.appendChild(option);
 }
 if(tableNumber){
  document.getElementById("orderMode").value="table";
  document.getElementById("tableSelect").value=tableNumber;
 }
 updateOrderMode();
}

function updateOrderMode(){
 orderMode=document.getElementById("orderMode").value;
 const wrap=document.getElementById("tableSelectWrap");
 wrap.style.display=orderMode==="table"?"block":"none";
 if(orderMode!=="table") tableNumber=null;
 updateTableSelection();

 const address=document.getElementById("customerAddress");
 address.hidden=orderMode==="table";
 address.required=orderMode==="takeaway";
 address.placeholder=orderMode==="table"?"Masada siparişte gerekmez":"Teslimat adresiniz";
 document.getElementById("customerPhone").placeholder=orderMode==="table"?"Telefon numaranız (isteğe bağlı)":"Telefon numaranız";
}

function updateTableSelection(){
 const chosen=document.getElementById("tableSelect").value;
 tableNumber=orderMode==="table"&&chosen?chosen:null;
 const banner=document.getElementById("tableBanner");

 if(tableNumber){
  banner.textContent="🍽️ Masa "+tableNumber+" · Masada sipariş";
  banner.style.display="block";
 }else{
  banner.style.display="none";
 }
}

function renderCategories(){
 const bar=document.getElementById("categoryBar");
 bar.replaceChildren();

 categories.forEach((category,index)=>{
  const button=document.createElement("button");
  button.type="button";
  button.className="category-btn"+(index===selectedCategory?" active":"");
  button.textContent=category.name;
  button.setAttribute("aria-pressed",String(index===selectedCategory));

  button.addEventListener("click",()=>{
   selectedCategory=index;
   renderCategories();
   renderProducts();
   document.querySelector(".category-btn.active")?.scrollIntoView({behavior:"smooth",block:"nearest",inline:"nearest"});
  });

  bar.appendChild(button);
 });
}

function renderProducts(){
 const category=categories[selectedCategory];
 const container=document.getElementById("products");
 document.getElementById("categoryTitle").textContent=category.name;
 document.getElementById("productCount").textContent=category.items.length+" ürün";
 container.replaceChildren();

 category.items.forEach(([name,price])=>{
  const key=category.name+"::"+name;
  const card=document.createElement("article");
  card.className="product";

  const info=document.createElement("div");
  const productName=document.createElement("div");
  productName.className="product-name";
  productName.textContent=name;

  const productPrice=document.createElement("span");
  productPrice.className="price";
  productPrice.textContent=formatPrice(price);
  info.append(productName,productPrice);

  const addButton=document.createElement("button");
  addButton.type="button";
  addButton.className="add-btn";
  addButton.textContent="+ Ekle";
  addButton.setAttribute("aria-label",name+" sepete ekle");

  addButton.addEventListener("click",()=>{
   if(portionCategories.includes(category.name)){
    showPortionChoice(category.name,name,price);
   }else{
    addToCart(key,name,price);
   }
  });

  card.append(info,addButton);
  container.appendChild(card);
 });
}
function showPortionChoice(category,name,price){
  const key=category+"-"+name;
  const choice=prompt(
    name+" seçimi:\n1 - Normal porsiyon ("+price+" TL)\n2 - 1,5 porsiyon ("+Math.round(price*1.5)+" TL)\n\n1 veya 2 yaz:"
  );
  if(choice==="1"){
    addToCart(key,name,price);
  }else if(choice==="2"){
    addToCart(key+"-15",name+" (1,5 Porsiyon)",Math.round(price*1.5));
  }
}

function addToCart(key,name,price){
  if(cart[key]){
    cart[key].quantity++;
  }else{
    cart[key]={name:name,price:price,quantity:1};
  }
  renderCart();
}

function changeQuantity(key,amount){
  if(!cart[key])return;
  cart[key].quantity+=amount;
  if(cart[key].quantity<=0)delete cart[key];
  renderCart();
}

function removeItem(key){
  delete cart[key];
  renderCart();
}

function clearCart(){
  cart={};
  renderCart();
}

function renderCart(){
  const container=document.getElementById("cartItems");
  const totalElement=document.getElementById("total");
  if(!container||!totalElement)return;

  const entries=Object.entries(cart);
  if(entries.length===0){
    container.innerHTML="<p>Sepetiniz boş.</p>";
    totalElement.textContent="0 TL";
    return;
  }

  let total=0;
  container.innerHTML=entries.map(([key,item])=>{
    const subtotal=item.price*item.quantity;
    total+=subtotal;
    return `
      <div class="cart-item">
        <div>
          <strong>${item.name}</strong>
          <p>${item.price} TL × ${item.quantity} = ${subtotal} TL</p>
        </div>
        <div class="quantity-controls">
          <button onclick="changeQuantity('${key}',-1)">−</button>
          <span>${item.quantity}</span>
          <button onclick="changeQuantity('${key}',1)">+</button>
          <button onclick="removeItem('${key}')">Sil</button>
        </div>
      </div>
    `;
  }).join("");

  totalElement.textContent=total+" TL";
}

function sendOrder(){
  const entries=Object.values(cart);
  if(entries.length===0){
    alert("Kanka, önce sepete ürün ekle.");
    return;
  }

  const orderMode=document.querySelector(
    'input[name="orderMode"]:checked'
  )?.value||"Paket";

  const payment=document.querySelector(
    'input[name="payment"]:checked'
  )?.value||"Belirtilmedi";

  const table=document.querySelector(
    'input[name="table"]:checked'
  )?.value||"Belirtilmedi";

  let total=0;
  let message="*HANCAN KEBAP DÖNER SİPARİŞİ*%0A%0A";

  message+="Sipariş türü: "+orderMode+"%0A";
  if(orderMode==="Masa"){
    message+="Masa: "+table+"%0A";
  }
  message+="Ödeme yöntemi: "+payment+"%0A%0A";
  message+="*Ürünler:*%0A";

  entries.forEach(item=>{
    const subtotal=item.price*item.quantity;
    total+=subtotal;
    message+="- "+item.name+" x"+item.quantity+
      " = "+subtotal+" TL%0A";
  });

  message+="%0A*Toplam: "+total+" TL*";

  if(payment==="IBAN"){
    message+="%0A%0AHesap sahibi: Mehmet Yıldız";
    message+="%0AIBAN: TR63 0015 7000 0000 0158 1639 83";
  }

  const url="https://wa.me/"+WHATSAPP_NUMBER+
    "?text="+encodeURIComponent(
      decodeURIComponent(message.replace(/%0A/g,"\n"))
    );

  window.open(url,"_blank");
}

setupTableOptions();
renderPaymentOptions();
renderCategories();
renderProducts();
renderCart();
</script>
</body>
</html>
