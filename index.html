<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151515">
<title>Hancan Kebap Döner | Menü ve Sipariş</title>
<style>
:root{--gold:#d5a642;--dark:#151515;--panel:#222;--text:#f7f7f7;--muted:#bcbcbc;--green:#20b65a}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#111;color:var(--text)}
header{text-align:center;padding:28px 15px 22px;background:linear-gradient(135deg,#252525,#101010);border-bottom:2px solid var(--gold)}
.logo{width:76px;height:76px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);border-radius:50%;color:var(--gold);font-size:28px;font-weight:900}
header h1{margin:0;color:var(--gold);font-size:clamp(25px,5vw,36px)}
header p{color:#ddd;margin:8px 0 0}
.container{width:min(1100px,100%);margin:auto;padding:18px 14px 40px}
h2{color:var(--gold);margin:10px 0 16px}
.category-bar{display:flex;gap:9px;overflow-x:auto;padding:5px 2px 14px;margin-bottom:12px;scrollbar-width:thin;scrollbar-color:var(--gold) #292929;position:sticky;top:0;z-index:10;background:#111}
.category-button,.category-button.active{flex:0 0 auto;border:1px solid #f5d76e!important;border-radius:22px!important;background:#d5a642!important;color:#151515!important;padding:12px 16px;font-size:14px;font-weight:bold;cursor:pointer;white-space:nowrap}
.category-button.active{background:#f0c75e!important;color:#111!important;box-shadow:0 0 0 2px #d5a642}
.menu-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 16px}
.menu-heading h2{margin:0}
.product-count{color:var(--muted);font-size:13px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;background:var(--panel);border:1px solid #353535;border-radius:12px;padding:14px 12px}
.product-name{font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.price{display:block;color:var(--gold);font-weight:bold;margin-top:7px;white-space:nowrap}
.add-btn{flex:0 0 auto;background:#d5a642!important;color:#151515!important;border:1px solid #f5d76e!important;border-radius:8px;padding:10px 12px;font-weight:bold;cursor:pointer}
.cart{margin-top:30px;padding:18px;background:#202020;border:1px solid #414141;border-radius:14px}
.cart h2{margin-top:0}
.empty-cart{color:var(--muted);font-size:14px}
.cart-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #3c3c3c}
.cart-item-name{font-size:14px;line-height:1.5}
.cart-item-price{color:var(--gold);font-weight:bold;white-space:nowrap}
.qty-controls{display:flex;align-items:center;gap:9px;margin-top:7px}
.qty-btn{width:30px;height:30px;border:0;border-radius:7px;font-size:18px;font-weight:bold;background:#444;color:white;cursor:pointer}
.remove-btn{background:transparent;border:0;color:#ff8585;cursor:pointer;font-size:12px;padding:5px 0}
.cart-total{display:flex;justify-content:space-between;gap:10px;font-size:20px;font-weight:bold;padding:18px 0}
.cart-total span:last-child{color:var(--gold)}
.order-fields{display:grid;gap:10px;margin-top:8px}
.order-fields input,.order-fields textarea{width:100%;border:1px solid #4b4b4b;background:#151515;color:white;border-radius:8px;padding:12px;font:inherit}
.order-fields textarea{min-height:75px;resize:vertical}
.payment-section{margin-top:20px}
.payment-section h3{color:var(--gold);margin:0 0 8px}
.payment-hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.payment-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.payment-option{display:flex;align-items:center;gap:10px;min-height:64px;padding:12px;background:#171717;border:1px solid #454545;border-radius:10px;cursor:pointer;text-align:left;color:white;font:inherit}
.payment-option.selected{border:2px solid var(--gold);background:#292317}
.payment-option strong{color:var(--gold)}
.whatsapp-btn{display:block;width:100%;margin-top:14px;padding:15px;border:0;border-radius:9px;background:var(--green);color:white;font-size:16px;font-weight:bold;text-align:center;cursor:pointer}
.clear-btn{width:100%;margin-top:10px;padding:11px;background:transparent;border:1px solid #666;border-radius:8px;color:#ddd;cursor:pointer}
.mode-panel{margin:0 0 18px;padding:16px;background:#202020;border:1px solid #414141;border-radius:12px}
.mode-panel label{display:block;color:var(--gold);font-weight:bold;margin-bottom:8px}
.mode-panel select{width:100%;padding:12px;border:1px solid #555;border-radius:8px;background:#151515;color:white;font:inherit}
#tableSelectWrap{margin-top:12px;display:none}
.table-banner{display:none;margin:0 0 18px;padding:14px;border:1px solid var(--gold);border-radius:10px;background:#292317;color:var(--gold);font-weight:bold}
footer{padding:24px 12px;text-align:center;color:#999;border-top:1px solid #333;font-size:13px}
@media(max-width:420px){.payment-options{grid-template-columns:1fr}}
@media(max-width:520px){.products{grid-template-columns:1fr}.product{padding:14px}.container{padding-left:12px;padding-right:12px}}
@media(min-width:800px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="logo">HC</div><h1>HANCAN KEBAP DÖNER</h1><p>Lezzetin doğru adresi</p></header>
<main class="container">
<div id="tableBanner" class="table-banner" role="status"></div>
<section class="mode-panel">
<label for="orderMode">Sipariş türü</label>
<select id="orderMode"><option value="">Sipariş türünü seçin</option><option value="Masa">Masada sipariş</option><option value="Paket Servis">Paket sipariş</option></select>
<div id="tableSelectWrap"><label for="tableSelect" style="margin-top:12px">Masa numaranız</label><select id="tableSelect"><option value="">Masanızı seçin</option></select></div>
</section>
<h2>Menümüz</h2><nav id="categoryBar" class="category-bar" aria-label="Menü kategorileri"></nav>
<section aria-live="polite"><div class="menu-heading"><h2 id="categoryTitle">Pide Çeşitleri</h2><span id="productCount" class="product-count"></span></div><div id="products" class="products"></div></section>
<section class="cart"><h2>🛒 Sipariş Sepetim</h2><div id="cartItems"><p class="empty-cart">Henüz sepete ürün eklemedin.</p></div><div class="cart-total"><span>Toplam</span><span id="total">0 TL</span></div>
<div class="order-fields"><input id="customerName" type="text" placeholder="Adınız soyadınız" autocomplete="name"><input id="customerPhone" type="tel" placeholder="Telefon numaranız" autocomplete="tel"><input id="customerAddress" type="text" placeholder="Teslimat adresiniz" autocomplete="street-address"><textarea id="orderNote" placeholder="Sipariş notunuz (isteğe bağlı)"></textarea></div>
<section class="payment-section"><h3>Ödeme yöntemi</h3><p class="payment-hint">Ödeme yapacağınız yöntemi seçin.</p><div id="paymentOptions" class="payment-options"></div></section>
<button class="whatsapp-btn" id="sendOrder">WhatsApp ile Sipariş Ver</button><button class="clear-btn" id="clearCart">Sepeti Temizle</button></section>
</main><footer>Hancan Kebap Döner · Afiyet olsun!</footer>
<script>
const categories = [
{name:"Pide Çeşitleri",items:[["Lahmacun",120],["Kıymalı Pide",200],["Kıymalı Kaşarlı",230],["Kuşbaşılı",250],["Kuşbaşılı Kaşarlı",280],["Mevlana Pide",270],["Bıçak Arası Kıyma",280],["Kaşarlı Pide",230],["Kaşarlı Yumurtalı",260],["Kavurmalı Kaşarlı",270]]},
{name:"Döner Çeşitleri",items:[["Ekmek Arası (100 GR)",150],["Klasik (100 GR)",150],["Hatay Soslu (100 GR)",150],["Zurna Döner (130 GR)",200],["Pilav Üstü (100 GR)",200],["Pilav Üstü (150 GR)",240],["Porsiyon Döner (150 GR)",250],["Porsiyon Döner (200 GR)",290]]},
{name:"Kebap ve Izgara",items:[["Burdur Şiş",450],["Adana Kebap",450],["Kuzu Şiş",500],["Ciğer Şiş",500],["Tavuk Şiş",350],["Tavuk Kanat",360],["Patlıcanlı Kebap",450],["Domatesli Kebap",450],["Sarma Beyti",500],["Altı Ezmeli",450],["Yoğurtlu Kebap",500],["Tavuk Kelebek",340],["Tavuk Pirzola",340],["4 Kişilik Hancan Karışık Kebap",2200],["Tek Kişilik Karışık Special",900],["Izgara Köfte",450]]},
{name:"Dürüm Çeşitleri",items:[["Adana Dürüm",220],["Urfa Dürüm",220],["Lahmacun Arası Adana",350],["Tavuk Şiş",200],["Kuzu Şiş",290],["Ciğer Şiş",290],["Köfte Dürüm",220],["Yarım Ekmek Köfte",220],["Special Karışık Dürüm (Adana-Kuzu)",450]]},
{name:"Kiloluk Tavuk ve Izgara",items:[["Kanat 1 KG",699],["Kelebek 1 KG",499],["Pirzola 1 KG",499],["Tavuk Şiş 1 KG",649],["5 Şiş Adana + 5 Şiş Tavuk",1700],["Izgara Köfte 1 KG",1400]]},
{name:"Çorba Çeşitleri",items:[["Mercimek Çorbası",200],["Tavuk Çorbası",200],["Kelle Paça Çorbası",250],["İşkembe Çorbası",250]]},
{name:"Burgerler",items:[["Et Hamburger",350],["Tavuk Hamburger",250]]},
{name:"Saç Kavurmalar",items:[["Et Saç Kavurma",560],["Tavuk Saç Kavurma",360]]},
{name:"Güveç Çeşitleri",items:[["Güveçte Köfte",450],["Güveçte Kuzu",560],["Güveçte Tavuk",360]]},
{name:"Tatlılar",items:[["Fırın Sütlaç",80],["Supangle",80],["Sade Künefe",200],["Fıstıklı Künefe",250],["Kare Katmer",250],["Gül Katmer",250],["Fıstıklı Burma",250]]},
{name:"İçecek Çeşitleri",items:[["Coca cola 33cl.",80],["Coca cola Zero 33cl.",80],["Fanta 33cl.",80],["Sprite 33 cl.",80],["Fuse tea Karpuz 33cl.",80],["Fuse tea Şeftali 33cl.",80],["Fuse tea Mango 33cl.",80],["Fuse tea Limon 33cl.",80],["Fuse tea Çilek 33cl.",80],["Cappy şeftali 33cl.",80],["Cappy karışık 33cl.",80],["Cappy vişne 33cl.",80],["Sütaş ayran 27cl.",50],["Acılı şalgam 33cl.",50],["Acısız şalgam 33cl.",50],["Su 0.5",20],["1 litre kola",100],["1 litre fanta",100],["1 litre sprite",100],["1 litre ayran",80],["1 litre acılı şalgam",80],["1 litre acısız şalgam",80],["2.5 litre kola",130],["2.5 litre fanta",130]]},
{name:"Mezeler",items:[["Humus",200],["Mutebbel",200],["Babağannuş",200],["Acı Ezme",150],["Haydari",150],["Köpoğlu",200]]}
];
const WHATSAPP_NUMBER="905451546507";
const paymentMethods=["Nakit","Banka / Kredi Kartı","Multinet","Edenred Ticket","Metropol","Pluxee (Sodexo)","Setcard","Token flex","MoneyYemek","IBAN ile Havale/EFT"];
const IBAN_OWNER="Mehmet Yıldız", IBAN_NUMBER="TR63 0015 7000 0000 0158 1639 83";
const portionCategories=["Pide Çeşitleri","Kebap ve Izgara","Dürüm Çeşitleri","Saç Kavurmalar","Güveç Çeşitleri"];
let selectedCategory=0,selectedPayment="",orderMode="";
const cart=new Map();
const $=id=>document.getElementById(id);
const money=n=>Number(n).toLocaleString("tr-TR")+" TL";
function renderCategories(){
 const bar=$("categoryBar");
 bar.innerHTML=categories.map((c,i)=>`<button type="button" class="category-button ${i===selectedCategory?"active":""}" data-category="${i}">${c.name}</button>`).join("");
 bar.querySelectorAll("[data-category]").forEach(b=>b.addEventListener("click",()=>{selectedCategory=Number(b.dataset.category);renderCategories();renderProducts();}));
}
function renderProducts(){
 const cat=categories[selectedCategory],box=$("products");
 $("categoryTitle").textContent=cat.name;$("productCount").textContent=cat.items.length+" ürün";
 box.innerHTML=cat.items.map(([n,p])=>`<article class="product"><div><div class="product-name">${n}</div><strong class="price">${money(p)}</strong></div><button class="add-btn" type="button" data-name="${encodeURIComponent(n)}" data-price="${p}">Ekle +</button></article>`).join("");
 box.querySelectorAll(".add-btn").forEach(b=>b.addEventListener("click",()=>addItem(decodeURIComponent(b.dataset.name),Number(b.dataset.price),cat.name)));
}
function addItem(name,price,category,portion="Normal"){
 const key=category+"::"+name+"::"+portion;
 if(cart.has(key))cart.get(key).quantity++;else cart.set(key,{name,price,category,portion,quantity:1});
 renderCart();
}
function renderCart(){
 let total=0,count=0;
 $("cartItems").innerHTML=cart.size?Array.from(cart.entries()).map(([key,item])=>{const sub=item.price*item.quantity;total+=sub;count+=item.quantity;return `<div class="cart-item"><div class="cart-item-name"><strong>${item.name}</strong><div class="cart-item-price">${item.portion} · ${money(item.price)}</div><button class="remove-btn" data-remove="${encodeURIComponent(key)}">Kaldır</button></div><div class="qty-controls"><button class="qty-btn" data-minus="${encodeURIComponent(key)}">−</button><strong>${item.quantity}</strong><button class="qty-btn" data-plus="${encodeURIComponent(key)}">+</button></div></div>`}).join(""):'<p class="empty-cart">Henüz sepete ürün eklemedin.</p>';
 $("total").textContent=money(total);
 $("cartItems").querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>changeQty(decodeURIComponent(b.dataset.minus),-1));
 $("cartItems").querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>changeQty(decodeURIComponent(b.dataset.plus),1));
 $("cartItems").querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{cart.delete(decodeURIComponent(b.dataset.remove));renderCart()});
}
function changeQty(key,delta){if(!cart.has(key))return;const x=cart.get(key);x.quantity+=delta;if(x.quantity<=0)cart.delete(key);renderCart()}
function renderPayments(){
 $("paymentOptions").innerHTML=paymentMethods.map((m,i)=>`<button type="button" class="payment-option" data-payment="${i}"><strong>${m}</strong></button>`).join("");
 $("paymentOptions").querySelectorAll("[data-payment]").forEach(b=>b.onclick=()=>{selectedPayment=paymentMethods[Number(b.dataset.payment)];$("paymentOptions").querySelectorAll(".payment-option").forEach(x=>x.classList.toggle("selected",x===b));});
}
function sendOrder(){
 if(!cart.size){alert("Önce sepete ürün eklemelisin.");return}
 const mode=$("orderMode").value,name=$("customerName").value.trim(),phone=$("customerPhone").value.trim(),address=$("customerAddress").value.trim(),table=$("tableSelect").value;
 if(!mode){alert("Lütfen sipariş türünü seç.");return}
 if(!name){alert("Lütfen adınızı yazın.");$("customerName").focus();return}
 if(mode==="Masa"&&!table){alert("Lütfen masa numaranızı seçin.");return}
 if(mode==="Paket Servis"&&(!phone||!address)){alert("Paket sipariş için telefon ve adresi doldurun.");return}
 if(!selectedPayment){alert("Lütfen ödeme yöntemini seçin.");return}
 const lines=["🍽️ *HANCAN KEBAP DÖNER — SİPARİŞ*","","👤 Müşteri: "+name,"📞 Telefon: "+(phone||"Belirtilmedi"),"📍 Sipariş türü: "+mode];
 if(mode==="Masa")lines.push("🪑 Masa: "+table);
 if(mode==="Paket Servis")lines.push("🏠 Adres: "+address);
 lines.push("","🛒 *SİPARİŞ DETAYI*");let total=0;
 for(const item of cart.values()){const sub=item.price*item.quantity;total+=sub;lines.push(`• ${item.name} (${item.portion}) x${item.quantity} — ${money(sub)}`)}
 lines.push("","💳 Ödeme: "+selectedPayment,"💰 *TOPLAM: "+money(total)+"*");
 const note=$("orderNote").value.trim();if(note)lines.push("📝 Not: "+note);
 if(selectedPayment==="IBAN ile Havale/EFT")lines.push("Alıcı: "+IBAN_OWNER,"IBAN: "+IBAN_NUMBER);
 lines.push("","Afiyet olsun!");
 window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(lines.join("\n")),"_blank");
}
function clearCart(){if(cart.size&&confirm("Sepetteki tüm ürünler silinsin mi?")){cart.clear();renderCart()}}
function setup(){
 for(let i=1;i<=25;i++){const o=document.createElement("option");o.value=String(i);o.textContent="Masa "+i;$("tableSelect").appendChild(o)}
 $("orderMode").addEventListener("change",()=>{orderMode=$("orderMode").value;$("tableSelectWrap").style.display=orderMode==="Masa"?"block":"none";$("customerAddress").style.display=orderMode==="Masa"?"none":"block";});
 $("sendOrder").addEventListener("click",sendOrder);$("clearCart").addEventListener("click",clearCart);
 renderPayments();renderCategories();renderProducts();renderCart();
 const params=new URLSearchParams(location.search),t=Number(params.get("masa"));
 if(Number.isInteger(t)&&t>=1&&t<=25){$("orderMode").value="Masa";$("tableSelect").value=String(t);$("tableSelectWrap").style.display="block";}
}
document.addEventListener("DOMContentLoaded",setup);
</script>
</body>
</html>
